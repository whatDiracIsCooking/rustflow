# The BATCH path: one-shot runs that bring their own container and exit. The
# other path is the devcontainer (.devcontainer/ + devtools/devcontainer.sh),
# which is the interactive and agent-facing one. Both build the SAME image --
# the repo's one ../Dockerfile -- so a result here and a result in there mean
# the same thing.
#
#   export HOST_UID=$(id -u) HOST_GID=$(id -g)
#   docker compose -f docker/compose.yaml run --rm check
#
# Note `context: ..`: the image builds from the REPO ROOT, never from this
# directory, because the Dockerfile is at the root (shared with
# .devcontainer/).
#
# HOST_UID/HOST_GID are required (`:?` below) rather than defaulted: a default
# of 1000 on a host where you are not uid 1000 writes root-owned files into the
# bind mount, and that failure surfaces much later as a confusing permission
# error. See env.example and README.md in this directory.
# Pinned, NOT derived. Compose defaults the project name to the directory
# holding this file -- "docker" -- which would create volumes called
# docker_cargo-registry and docker_target and a docker_default network. Those
# names are not specific to anything, so a second repo of yours laid out the
# same way (docker/compose.yaml) would silently share this project's build
# cache and network. Pinning it also keeps the volume names below equal to the
# ones .devcontainer/devcontainer.json mounts, so both front ends warm ONE
# cargo registry and ONE /target instead of a cold cache each.
name: rustflow

x-rust: &rust
  image: ${RUSTFLOW_IMAGE:-rustflow:latest}
  build:
    context: ..
    dockerfile: Dockerfile
    args:
      HOST_UID: ${HOST_UID:?Set HOST_UID via id -u}
      HOST_GID: ${HOST_GID:?Set HOST_GID via id -g}
  volumes:
    - ..:/workspace
    # Named volumes, not binds: the registry download and the build artifacts
    # are container-side state. /target in particular must NOT land in the
    # bind mount, or a container build and a host build overwrite each other's
    # artifacts in ./target.
    - cargo-registry:/usr/local/cargo/registry
    - target:/target
  # Bare names, no `${...:-}` defaults, and that distinction matters: this form
  # forwards each variable only when the host actually has it set, and omits it
  # from the container entirely when it does not. Spelling them `${VAR:-}`
  # instead would inject an EMPTY value, and an empty ANTHROPIC_API_KEY reads
  # as "a key was configured" to the thing that finds it.
  #
  # None is required, and Claude Code's two are usually not wanted: the
  # ~/.claude bind above already logs the container in as you. They are here
  # for the headless case -- a CI runner or a host with no ~/.claude -- where
  # CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) authenticates with no
  # config at all. GH_TOKEN is different: it is the ONLY way in-container `gh`
  # is authenticated, and the only way `git push` works, since the image has no
  # ssh client for this repo's git@github.com: remote.
  environment:
    - ANTHROPIC_API_KEY
    - CLAUDE_CODE_OAUTH_TOKEN
    - GH_TOKEN
  working_dir: /workspace
  user: "${HOST_UID:?Set HOST_UID via id -u}:${HOST_GID:?Set HOST_GID via id -g}"

services:
  # The gate: what CI runs and what prepush should run. `bash -c`, never
  # `bash -lc` -- a login shell sources /etc/profile, which resets PATH and
  # loses the image's /usr/local/cargo/bin.
  check:
    <<: *rust
    command:
      - bash
      - -c
      - |
        set -e
        cargo fmt --all --check
        cargo clippy --all-targets --all-features -- -D warnings
        cargo test --all-features ${CARGO_TEST_ARGS:-}

  # The long-lived interactive container devtools/devcontainer.sh execs into,
  # and the one an in-container `claude` runs in. It holds no state of its own
  # -- the volumes and the bind below do -- so `down` is cheap.
  dev:
    <<: *rust
    command: ["sleep", "infinity"]
    init: true
    # The anchor's three mounts repeated, because a YAML merge key cannot
    # EXTEND a sequence -- `volumes:` here replaces the anchor's list outright,
    # so every entry has to be present. Worth that duplication to keep the
    # Claude Code mounts off `check`, `test` and `build`: those run cargo and
    # have no use for them, and the bind source below is a real host directory
    # that docker CREATES (owned by root) when it is missing -- so a batch
    # `docker compose run --rm check` on a machine that has never run Claude
    # Code would quietly leave a root-owned ~/.claude behind.
    volumes:
      - ..:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - target:/target
      # Claude Code's config dir -- $HOME/.claude, with HOME pinned in the
      # Dockerfile so this path is nameable here at all. The one
      # BIND here rather than a volume, and deliberately read-write: it is the
      # host's own ~/.claude, so the container is logged in because you are, with
      # no token to mint and no /login to answer.
      #
      # A directory, not just the credentials file inside it. A single-file bind
      # mount cannot be REPLACED, only written through -- an atomic
      # write-temp-then-rename, which is how a careful writer updates a
      # credential, fails on one with
      #     OSError: [Errno 16] Device or resource busy
      # (measured). Mounting the directory leaves the rename inside the mount,
      # where it works.
      #
      # Shared live rather than copied, for the same reason: the file holds a
      # refreshToken that is rewritten when the access token refreshes. One copy
      # cannot go stale against the other, and a container refresh cannot
      # invalidate the host's login.
      #
      # ~/.claude.json is NOT in here -- Claude Code keeps it BESIDE the config
      # directory, so it stays in the container's own filesystem -- and
      # that is load-bearing, not an oversight. It is one monolithic JSON holding
      # every project's state, rewritten whole on each change, so sharing it
      # would be last-writer-wins between the host and this container.
      # devtools/container-bootstrap.sh gives the container its own copy instead.
      - ${CLAUDE_CONFIG_SRC:-${HOME}/.claude}:/home/dev/.claude
      # Two subtrees shadowed back out of that bind, so the container cannot
      # write them: a plugin install rewrites state every other session on the
      # host shares, and can be environment-specific besides. Empty volumes mean
      # the container simply has no plugins, which for a build container is the
      # right amount.
      - claude-plugins:/home/dev/.claude/plugins
      - claude-backups:/home/dev/.claude/backups

  build:
    <<: *rust
    command: ["bash", "-c", "cargo build ${CARGO_BUILD_ARGS:-}"]

  test:
    <<: *rust
    command: ["bash", "-c", "cargo test --all-features ${CARGO_TEST_ARGS:-}"]

volumes:
  # Explicit `name:` so these are NOT prefixed with the project name --
  # devcontainer.json mounts them by these exact names, and a `rustflow_`
  # prefix here would make it mount two different, empty volumes instead.
  cargo-registry:
    name: rustflow-cargo-registry
  target:
    name: rustflow-target
  # Both exist only to shadow a subtree of the ~/.claude bind, so they are
  # expected to stay empty and are safe for `nuke` to drop.
  claude-plugins:
    name: rustflow-claude-plugins
  claude-backups:
    name: rustflow-claude-backups
