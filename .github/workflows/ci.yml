# The gate, named `ci` because the `pr` skill and automerge.yml both key off
# that exact name. Four of the gate's five commands are steps of this job --
# the same four as `devtools/devcontainer.sh check` and the `check` service in
# docker/compose.yaml, in the same container image -- so a green run here and a
# green run on your machine mean the same thing. The remaining one, `cargo deny
# check`, is the separate `deny` job below rather than a step here, for the
# reason given there; this workflow is green only when both jobs are, which is
# also what automerge.yml waits on.
#
# The toolchain pin lives in ONE place: `ARG RUST_VERSION` in the root
# Dockerfile. The image below must be kept equal to it by hand; there is no
# mechanism enforcing that, so when you bump one, bump the other.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A second push to a PR branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    container:
      image: rust:1.100-slim-bookworm
    steps:
      # Before checkout, deliberately: the slim image has no git, and
      # actions/checkout silently falls back to a REST tarball without it,
      # leaving no .git directory. This is the Dockerfile's FIRST apt list
      # ("what the Rust build needs") verbatim; its second one installs agent
      # tooling -- claude, gh, python3 -- which this job has no use for.
      - name: Install container prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates pkg-config libssl-dev
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      # The official rust images install with --profile minimal, so neither
      # clippy nor rustfmt is present until asked for.
      - name: Add clippy and rustfmt
        run: rustup component add clippy rustfmt

      - name: Toolchain versions
        run: rustc --version && cargo --version && cargo clippy --version

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      # Needs no tool the image does not already have, which is why this one
      # is a step here and `cargo deny check` is a job of its own. `cargo
      # test` builds the doc-tests, so a *broken* intra-doc link already
      # fails above; what this adds is the rest of rustdoc's lints -- a link
      # to a private item being the one that accumulated unseen (#57).
      - name: Docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --all-features

      # No dependency caching yet, on purpose: this crate has zero
      # dependencies, so a cache round-trip would cost more than the build it
      # saves. Add actions/cache on ~/.cargo/registry and ./target once there
      # is a dependency tree worth restoring.

  # The one gate command that is not a step of `ci` above: `cargo deny check`
  # against deny.toml -- licenses, RustSec advisories, duplicate versions,
  # crate sources.
  #
  # A separate job, and NOT a step in `ci` above, because the image that job
  # runs in is the stock rust one, which has no cargo-deny. (The repo's own
  # Dockerfile installs one, pinned by ARG CARGO_DENY_VERSION, but CI does not
  # build that image.) Adding `cargo install cargo-deny --locked` to `ci`
  # would compile a few hundred crates on every PR for a check whose only
  # inputs are Cargo.toml, Cargo.lock and deny.toml. The action below brings a
  # prebuilt musl binary instead, and the job runs in parallel with `ci`, so
  # the cost to a green PR is the ~1 min this takes end to end, not added
  # wall-clock.
  #
  # Pinned to a commit SHA with the tag beside it, rather than `@v2.1.2`: a
  # git tag can be moved and this third-party action executes arbitrary code
  # in CI, which is precisely the risk the rest of this PR is about. That
  # commit's image carries cargo-deny 0.21.0 -- keep it equal to
  # `ARG CARGO_DENY_VERSION` in the root Dockerfile when bumping either.
  #
  # The advisory database is cloned fresh on every run and deliberately not
  # cached: it is the one input that must not be stale, and it is seconds.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deny
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        # The action's own defaults, spelled out so this reads as the same
        # command the local gate runs. `--all-features` is also set in
        # deny.toml's [graph], so the local run checks the same graph.
        with:
          command: check
          arguments: --all-features
