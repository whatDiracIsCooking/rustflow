[package]
name = "rustflow"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "A Rust port of Taskflow, the C++ task-parallel programming system"
repository = "https://github.com/whatDiracIsCooking/rustflow"
readme = "README.md"
keywords = ["taskflow", "task-parallel", "dataflow", "concurrency", "dag"]
categories = ["concurrency"]

[dependencies]
# The crate's only runtime dependencies, and the ones the README's dependency
# policy admits: the Chase-Lev deque behind upstream's `wsq.hpp`, and the
# cache-line padding behind its `alignas(TF_CACHELINE_SIZE)`. Pinned exactly,
# for the same reason `RUST_VERSION` is pinned in the `Dockerfile`: moving a
# pin is a deliberate, repo-wide change rather than a side effect of a build.
crossbeam-deque = "=0.8.8"
crossbeam-utils = "=0.8.23"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
# `cfg(loom)` is set by hand -- see `tests/loom_notifier.rs` -- rather than by a
# Cargo feature, because a feature would let `--all-features` pull the loom
# model into the normal gate, where it does not belong.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[lints.clippy]
# A work-stealing scheduler is exactly the kind of code where an `as` cast or a
# silent wrap is a real bug, so these are loud from the start rather than
# retrofitted over a thousand call sites later.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
# `deny` rather than `warn`: the crate's `unsafe` is one waiter slot in the
# notifier, every site of it carries the invariant it rests on, and a new site
# arriving without one is a design to reconsider rather than a warning to read.
undocumented_unsafe_blocks = "deny"

# loom is the one dependency the notifier's `cfg(loom)` build pulls in, and the
# target expression is how it stays out of every other build: `cfg(loom)` is set
# by `RUSTFLAGS`, never by a feature, so a normal `cargo build` -- and the
# gate's -- resolves without it. It has to be a dependency of the *library*
# rather than a dev-dependency, because the atomics it replaces are the
# library's own; `tests/loom_notifier.rs` says what to run. Pinned exactly, for
# the same reason the runtime dependencies are.
[target.'cfg(loom)'.dependencies]
loom = "=0.7.3"

# Dev-only, and that distinction is the dependency policy's: a dev dependency
# "need only be useful", while a runtime one has to replace something upstream
# hand-wrote. None of these is in the library -- `cargo bench --no-run` and
# `cargo test` are the only things that build them -- so the shipped crate is
# still the two crossbeam crates and nothing else. Pinned exactly, like every
# other dependency here.
#
# `criterion` with no default features: the default set is
# `rayon + plotters + cargo_bench_support`, and `plotters` only draws the SVGs
# the `html_reports` feature emits -- which is *not* in the default set, so
# plotting is a few hundred crates of tree that nothing here would ever call.
# `cargo_bench_support` is what lets a criterion harness run under plain
# `cargo bench` at all, and `rayon` is criterion's own analysis parallelism,
# free here because the benchmarks depend on rayon anyway.
#
# `proptest` with no default features either, for `tests/properties.rs`: it
# generates the inputs the algorithm family is checked against `std` over, and
# the one feature kept, `std`, is what the generated case needs to run a real
# executor at all. Dropped with the default set are `fork` and `timeout`, which
# run each case in a subprocess under a wall-clock limit (`rusty-fork`,
# `wait-timeout`, `tempfile`) -- a case here is a graph run, not something that
# may abort the harness -- and `bit-set`, which only swaps in a denser bitset
# for shrinking than the fallback proptest ships.
[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = [
    "cargo_bench_support",
    "rayon",
] }
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
rayon = "=1.12.0"

# `harness = false` on each: criterion brings its own `main`, and libtest's
# would otherwise take the command line and report zero benchmarks. One target
# per upstream benchmark directory, named after it.
[[bench]]
name = "linear_chain"
harness = false

[[bench]]
name = "binary_tree"
harness = false

[[bench]]
name = "graph_traversal"
harness = false

[[bench]]
name = "embarrassing_parallelism"
harness = false

[[bench]]
name = "async_task"
harness = false

[[bench]]
name = "fibonacci"
harness = false

[[bench]]
name = "sort"
harness = false

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "data_pipeline"
harness = false

[[bench]]
name = "black_scholes"
harness = false

[[bench]]
name = "for_each"
harness = false

[[bench]]
name = "reduce_sum"
harness = false

[[bench]]
name = "scan"
harness = false
