# Mutants `cargo mutants` must not report, because no test should kill them:
# each is equivalent to the original, or pins a value the design leaves free.
# The argument for every one of them is in `DESIGN.md`, under "Documentation
# and tooling" -- in particular that the third mutant of
# `partitioner.rs:429:22`,
# `q > chunk_size`, is *not* here and is killed by
# `the_guided_loop_shrinks_its_chunks_with_the_remaining_work`.
#
# A pattern names one mutant by `file:line:col` and by its operator pair, so a
# line that moves makes it stop matching -- re-deriving the argument from
# `DESIGN.md` -- rather than quietly hiding whatever moved onto the line. Single
# quotes because these are regexes: a TOML basic string would eat the
# backslashes.
exclude_re = [
    # `EXCEPTION | CAUGHT` over two disjoint bits, where `a | b == a ^ b`.
    'graph/node\.rs:132:43: replace \| with \^ in NodeBase::claim_panic',
    'graph/node\.rs:162:47: replace \| with \^ in NodeBase::take_panic',
    # `if b1 > b2 { swap(b1, b2) }`: swapping equal bounds is a no-op.
    'algorithm/partitioner\.rs:679:15: replace > with >= in RandomPartitioner<C>::chunk_size_range',
    # The guided loop's floor clamp, whose condition its own branch makes false.
    'algorithm/partitioner\.rs:429:22: replace < with <= in <impl DynamicLoop for GuidedPartitioner<C>>::loop_dynamic_until',
    'algorithm/partitioner\.rs:429:22: replace < with == in <impl DynamicLoop for GuidedPartitioner<C>>::loop_dynamic_until',
    # `p1`, which picks the atomic that hands out the next chunk, not its size.
    'algorithm/partitioner\.rs:408:20: replace \* with \+ in <impl DynamicLoop for GuidedPartitioner<C>>::loop_dynamic_until',
    'algorithm/partitioner\.rs:408:20: replace \* with / in <impl DynamicLoop for GuidedPartitioner<C>>::loop_dynamic_until',
    'algorithm/partitioner\.rs:408:24: replace \* with \+ in <impl DynamicLoop for GuidedPartitioner<C>>::loop_dynamic_until',
    'algorithm/partitioner\.rs:408:24: replace \* with / in <impl DynamicLoop for GuidedPartitioner<C>>::loop_dynamic_until',
    'algorithm/partitioner\.rs:408:38: replace \+ with \* in <impl DynamicLoop for GuidedPartitioner<C>>::loop_dynamic_until',
    'algorithm/partitioner\.rs:408:38: replace \+ with - in <impl DynamicLoop for GuidedPartitioner<C>>::loop_dynamic_until',
    # `(resolved & !STACK_MASK) | index` over two disjoint fields, again
    # `a | b == a ^ b`.
    'executor/notifier\.rs:668:17: replace \| with \^ in <impl Notifier for NonblockingNotifier>::commit_wait',
    # A guard over `unpark_chain`, which walks no chain without it either.
    'executor/notifier\.rs:747:30: replace & with \| in <impl Notifier for NonblockingNotifier>::notify_all',
    'executor/notifier\.rs:747:30: replace & with \^ in <impl Notifier for NonblockingNotifier>::notify_all',
    # A guard over a `notify_n` that wakes nobody when it is asked for zero.
    'executor/mod\.rs:224:21: replace > with >= in Shared::bulk_schedule',
    # A worker's wait for a publication nothing can observe being absent.
    'executor/mod\.rs:264:9: replace StartGate::wait with \(\)',
    # Insurance against an unwind only a scheduler bug can cause, on a frame
    # that has already ended its run on every path a program takes.
    'executor/corun\.rs:223:9: replace <impl Drop for InnerRun>::drop with \(\)',
    # The corun search's attempt counter, which gates nothing but a
    # `yield_now`: its predicate is the only thing that ends the search.
    'executor/worker\.rs:430:43: replace \* with \+ in WorkerThread::steal_until',
    'executor/worker\.rs:430:43: replace \* with / in WorkerThread::steal_until',
    'executor/worker\.rs:430:38: replace \+ with - in WorkerThread::steal_until',
    'executor/worker\.rs:430:38: replace \+ with \* in WorkerThread::steal_until',
    'executor/worker\.rs:450:24: replace \+= with \*= in WorkerThread::steal_until',
    'executor/worker\.rs:451:27: replace > with == in WorkerThread::steal_until',
    'executor/worker\.rs:451:27: replace > with < in WorkerThread::steal_until',
    'executor/worker\.rs:451:27: replace > with >= in WorkerThread::steal_until',
    # The scheduling loop's own two thresholds, where what a mutant moves is
    # the attempt a worker yields on or gives up after. The mutants of the
    # same two lines that stop it giving up at all are caught.
    'executor/worker\.rs:1033:43: replace \* with \+ in WorkerThread::explore_task',
    'executor/worker\.rs:1033:43: replace \* with / in WorkerThread::explore_task',
    'executor/worker\.rs:1033:38: replace \+ with - in WorkerThread::explore_task',
    'executor/worker\.rs:1033:38: replace \+ with \* in WorkerThread::explore_task',
    'executor/worker\.rs:1051:27: replace > with >= in WorkerThread::explore_task',
    'executor/worker\.rs:1056:31: replace > with == in WorkerThread::explore_task',
    'executor/worker\.rs:1056:31: replace > with >= in WorkerThread::explore_task',
    'executor/worker\.rs:1056:31: replace > with < in WorkerThread::explore_task',
    'executor/worker\.rs:1056:37: replace \+ with - in WorkerThread::explore_task',
    'executor/worker\.rs:1056:37: replace \+ with \* in WorkerThread::explore_task',
    # A sticky victim is where the next search starts, not where the work is.
    'executor/worker\.rs:1104:64: replace \+ with - in WorkerThread::wait_for_task',
    # A worker's seed, which is a value nothing promises: what the fold is for
    # is that two threads get different streams, and both of these keep it.
    'executor/worker\.rs:1305:31: replace \^ with \| in seed_from_current_thread',
    'executor/worker\.rs:1305:31: replace \^ with & in seed_from_current_thread',
    # Three more `|`s over disjoint single bits, where `a | b == a ^ b`: the
    # run's half of `claim_panic`, and the `CANCELLED | EXCEPTION` pair that
    # "cancelled" means, read on the run and walked up the parent chain. The
    # `&` mutant of all three is a different program and all three are caught.
    'executor/topology/run\.rs:98:36: replace \| with \^ in Cancellable::claim_panic',
    'executor/topology/run\.rs:105:64: replace \| with \^ in Cancellable::cancelled',
    'executor/topology/ownership\.rs:202:49: replace \| with \^ in Parent::ancestor_cancelled',
    # A third guard over a call that is a no-op without it: `set_up_graph` reads
    # `CAUGHT` to decide whether a node's payload slot is worth locking, and
    # `clear_panic` on an unclaimed slot drops a `None`. Both mutants clear
    # every node unconditionally, which costs a mutex per node and changes
    # nothing. The `!=` mutant of the same line is a different program and is
    # caught by `setting_up_the_same_graph_again_rearms_it`.
    'executor/topology/run\.rs:639:53: replace & with \| in set_up_graph',
    'executor/topology/run\.rs:639:53: replace & with \^ in set_up_graph',
    # A fourth `|` over disjoint single bits: `ENTERED` is upstream's
    # `PREEMPTED | IMPLICITLY_ANCHORED` over `0x2000_0000` and `0x1000_0000`,
    # so `a | b == a ^ b` and `^` builds the same constant. The `&` mutant of
    # the same expression builds zero, which sets no bit and resumes no node,
    # and it is detected -- as a hang, under both test selections.
    'executor/runtime\.rs:122:38: replace \| with \^',
    # And a fourth guard over a call that is a no-op without it: `enter` reads
    # `CAUGHT` to decide whether a runtime node's payload slot is worth
    # locking before it forwards what nobody collected, and
    # `NodeBase::take_panic` on an unclaimed slot takes a `None` and clears
    # nothing. `|` makes the condition always true; `^` makes it true for
    # every word the unmutated program can reach, the one word it is false for
    # being `CAUGHT` alone, which `claim_panic` rules out by always setting
    # `EXCEPTION` beside it. Both pay a mutex per entry and change nothing.
    # The `!=` mutant of the same line is a different program and is caught.
    'executor/runtime\.rs:249:53: replace & with \| in enter',
    'executor/runtime\.rs:249:53: replace & with \^ in enter',
]
